# Reference nginx config — matches your working uworld setup.
# DO NOT replace Certbot-managed SSL lines on the server.
# Certbot adds listen 443 / ssl_certificate lines separately — leave those alone.
#
# Deploy on server:
#   sudo cp nginx-uworld-fixed.conf /etc/nginx/conf.d/zayan.conf
#   (re-add any Certbot SSL lines if cp overwrote them)
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify:
#   sudo nginx -T 2>/dev/null | grep client_max_body_size

server {
    server_name uworld-zayan.org www.uworld-zayan.org;

    # Allow large DOCX/markdown payloads and embedded images (nginx default is 1MB)
    client_max_body_size 50m;

    # Image uploads → Next.js proxy (streams to Nest; avoids 413 from direct /api/ → Nest)
    location = /api/questions/upload-image {
        client_max_body_size 200m;
        proxy_pass http://127.0.0.1:3001/api/questions/upload-image;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # NEXT.js API routes (case generation, MedPrep) — must be BEFORE /api/
    location ~ ^/api/(cases|learning|ai|evaluation|soap|medprep|conversations|diagnosis)(/|$) {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nest Swagger (full path /api/docs — do not strip /api)
    location ^~ /api/docs {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BACKEND API routes (/api/questions → /questions on Nest)
    location /api/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # BACKEND AUTH routes
    location /auth/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    # FRONTEND (all other routes — must come last)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Certbot adds these on the server — do not copy from repo, keep what certbot wrote:
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/uworld-zayan.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/uworld-zayan.org/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.uworld-zayan.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = uworld-zayan.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name uworld-zayan.org www.uworld-zayan.org;
    return 404; # managed by Certbot
}
