<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTL/LTR Button Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Arial', 'Tahoma', sans-serif, 'Noto Sans Arabic', 'Cairo';
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 750px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .container[dir="rtl"] {
            font-family: 'Cairo', 'Noto Sans Arabic', 'Tahoma', 'Arial', sans-serif;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            transition: all 0.3s ease;
        }

        .container[dir="ltr"] h1 {
            text-align: left;
        }

        .container[dir="rtl"] h1 {
            text-align: right;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .container[dir="ltr"] .subtitle {
            text-align: left;
        }

        .container[dir="rtl"] .subtitle {
            text-align: right;
        }

        .toggle-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .toggle-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .toggle-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .toggle-button:active {
            transform: translateY(0);
        }

        .buttons-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .icon-button {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 18px 30px;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
            color: #333;
            font-weight: 500;
            width: 100%;
            min-width: 400px;
            position: relative;
        }

        .caret {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .icon-button:hover .caret {
            opacity: 0.8;
        }

        /* Caret positioning for LTR */
        .container[dir="ltr"] .caret {
            margin-left: auto;
        }

        /* Content alignment for LTR */
        .container[dir="ltr"] .icon-button {
            padding-right: 50px;
            /* Make space for caret */
            justify-content: flex-start;
            flex-direction: row;
            text-align: left;
        }

        .container[dir="ltr"] .caret {
            right: 20px;
            left: auto;
        }

        /* Content alignment for RTL */
        .container[dir="rtl"] .icon-button {
            padding-left: 50px;
            /* Make space for caret */
            padding-right: 30px;
            justify-content: flex-end;
            flex-direction: row;
            text-align: right;
            font-size: 18px;
        }

        .container[dir="rtl"] .caret {
            left: 20px;
            right: auto;
            transform: scaleX(-1);
        }

        .container[dir="rtl"] .icon-button>.icon {
            margin-right: 0;
            margin-left: 15px;
        }

        .container[dir="rtl"] .icon-button>span {
            flex: 1;
            text-align: right;
        }

        .icon-button:hover {
            background: #e9ecef;
            border-color: #dee2e6;
        }

        .container[dir="ltr"] .icon-button:hover {
            transform: translateX(5px);
        }

        .container[dir="ltr"] .icon-button:hover .caret {
            transform: translateX(3px);
        }

        .container[dir="rtl"] .icon-button:hover {
            transform: translateX(-5px);
        }

        .container[dir="rtl"] .icon-button:hover .caret {
            transform: scaleX(-1) translateX(3px);
        }

        .icon-button:active {
            transform: scale(0.98);
        }

        .icon-button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        .icon-button.primary:hover {
            background: linear-gradient(135deg, #5a70e0 0%, #6a4198 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        /* Flip icons that should be flipped in RTL */
        .container[dir="rtl"] .icon.flip-rtl {
            transform: scaleX(-1);
        }

        .divider {
            height: 1px;
            background: #e9ecef;
            margin: 20px 0;
        }

        .status {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-button {
            animation: slideIn 0.4s ease forwards;
            opacity: 0;
        }

        .icon-button:nth-child(1) {
            animation-delay: 0.1s;
        }

        .icon-button:nth-child(2) {
            animation-delay: 0.2s;
        }

        .icon-button:nth-child(3) {
            animation-delay: 0.3s;
        }

        .icon-button:nth-child(4) {
            animation-delay: 0.4s;
        }

        .icon-button:nth-child(5) {
            animation-delay: 0.5s;
        }

        /* Language switch animation */
        .lang-switch {
            position: relative;
            overflow: hidden;
        }

        .lang-switch span {
            display: inline-block;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
    </style>
</head>

<body>
    <div class="container" dir="ltr" id="container">
        <h1 id="title">Button Layout Demo</h1>
        <p class="subtitle" id="subtitle">Icons and text align based on direction</p>

        <div class="toggle-container">
            <button class="toggle-button" onclick="toggleDirection()">
                <svg class="icon flip-rtl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12h18m0 0l-6-6m6 6l-6 6M21 12H3m0 0l6-6m-6 6l6 6" />
                </svg>
                <span id="toggleText" class="lang-switch">Switch to Arabic (RTL)</span>
            </button>
        </div>

        <div class="buttons-group">
            <button class="icon-button primary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span data-en="Home" data-ar="الرئيسية">Home</span>
                <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 5l7 7-7 7" />
                </svg>
            </button>

            <button class="icon-button">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span data-en="Profile" data-ar="الملف الشخصي">Profile</span>
                <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 5l7 7-7 7" />
                </svg>
            </button>

            <button class="icon-button">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span data-en="Settings" data-ar="الإعدادات">Settings</span>
                <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 5l7 7-7 7" />
                </svg>
            </button>

            <div class="divider"></div>

            <button class="icon-button">
                <svg class="icon flip-rtl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                <span data-en="Messages" data-ar="الرسائل">Messages</span>
                <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 5l7 7-7 7" />
                </svg>
            </button>

            <button class="icon-button">
                <svg class="icon flip-rtl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                <span data-en="Logout" data-ar="تسجيل الخروج">Logout</span>
                <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 5l7 7-7 7" />
                </svg>
            </button>

            <button class="icon-button">
                <svg class="icon flip-rtl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                </svg>
                <span data-en="Reports" data-ar="التقارير">Reports</span>
                <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 5l7 7-7 7" />
                </svg>
            </button>

            <button class="icon-button">
                <svg class="icon flip-rtl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span data-en="Calendar" data-ar="التقويم">Calendar</span>
                <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>

        <div class="status" id="status">
            Current Direction: <strong>LTR (Left-to-Right) - English</strong>
        </div>
    </div>

    <script>
        let isRTL = false;

        function toggleDirection() {
            const container = document.getElementById('container');
            const toggleText = document.getElementById('toggleText');
            const status = document.getElementById('status');
            const title = document.getElementById('title');
            const subtitle = document.getElementById('subtitle');

            isRTL = !isRTL;

            if (isRTL) {
                container.setAttribute('dir', 'rtl');
                container.setAttribute('lang', 'ar');
                toggleText.textContent = 'التبديل إلى الإنجليزية (LTR)';
                status.innerHTML = 'الاتجاه الحالي: <strong>RTL (من اليمين إلى اليسار) - العربية</strong>';
                title.textContent = 'عرض تخطيط الأزرار';
                subtitle.textContent = 'الأيقونات والنص تتماشى بناءً على الاتجاه';

                // Switch all button text to Arabic
                document.querySelectorAll('[data-ar]').forEach(element => {
                    element.textContent = element.getAttribute('data-ar');
                });
            } else {
                container.setAttribute('dir', 'ltr');
                container.setAttribute('lang', 'en');
                toggleText.textContent = 'Switch to Arabic (RTL)';
                status.innerHTML = 'Current Direction: <strong>LTR (Left-to-Right) - English</strong>';
                title.textContent = 'Button Layout Demo';
                subtitle.textContent = 'Icons and text align based on direction';

                // Switch all button text to English
                document.querySelectorAll('[data-en]').forEach(element => {
                    element.textContent = element.getAttribute('data-en');
                });
            }

            // Re-trigger animations
            const buttons = document.querySelectorAll('.icon-button');
            buttons.forEach((button, index) => {
                button.style.animation = 'none';
                setTimeout(() => {
                    button.style.animation = `slideIn 0.4s ease forwards`;
                    button.style.animationDelay = `${(index + 1) * 0.1}s`;
                }, 10);
            });
        }

        // Add click feedback to all buttons
        document.querySelectorAll('.icon-button').forEach(button => {
            button.addEventListener('click', function (e) {
                // Simple click feedback
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 100);
            });
        });
    </script>
</body>

</html>
